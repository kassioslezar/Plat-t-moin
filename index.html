<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الطبق الشاهد</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, "Helvetica Neue", Helvetica, sans-serif;
        }

        body {
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* صفحة A4 مقسمة لـ 4 بطاقات متلاصقة 100% */
        .a4-page {
            width: 210mm;
            height: 297mm;
            background: white;
            padding: 8mm;
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 0;
            box-shadow: 0 0 10px rgba(0,0,0,0.3);
        }

        /* كل بطاقة داخل محيط مربع أسود */
        .card {
            border: 1.5px solid #000;
            padding: 15px 18px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            margin-right: -1.5px;
            margin-bottom: -1.5px;
            background: #fff;
        }

        /* الجزء العلوي: الهيدر */
        .header {
            text-align: center;
            margin-bottom: 15px;
            line-height: 1.35;
        }

        .header h2 {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 6px;
        }

        .header p {
            font-size: 14px;
            font-weight: bold;
            color: #000;
        }

        /* سطر الوجبة والمربعات - مسافة أكبر */
        .meal-row {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 15px;
            margin-bottom: 18px; /* زيادة المسافة تحت الوجبة */
            font-size: 14px;
            font-weight: bold;
        }

        .meal-options {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .opt-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .box {
            width: 15px;
            height: 15px;
            border: 1.5px solid #000;
            display: inline-block;
        }

        .underline-label {
            text-decoration: underline;
        }

        /* تاريخ الوجبة ومكونات الوجبة - مسافات أكبر */
        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px; /* زيادة المسافة تحت تاريخ الوجبة ومكونات الوجبة */
            font-size: 14px;
            font-weight: bold;
        }

        /* تبعد أكبر بين أسطر النقاط */
        .dots-line {
            border-bottom: 1px dotted #000;
            margin: 14px 0; /* زيادة الفراغ بين أسطر النقاط */
            height: 10px;
            width: 100%;
        }

        /* التوقيعات مرفوعة مباشرة تحت النقاط */
        .signatures-container {
            margin-top: 8px; /* تقليل المسافة لرفع التوقيعات تحت النقاط مباشرة */
            font-size: 13.5px;
            font-weight: bold;
        }

        .sig-row-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .sig-row-bottom {
            display: flex;
            justify-content: flex-start;
            margin-bottom: 15px;
        }

        .bottom-border-line {
            border-bottom: 1.5px solid #000;
            width: 100%;
            margin-top: 5px;
        }

        /* إعدادات الطباعة A4 */
        @media print {
            @page {
                size: A4 portrait;
                margin: 0;
            }
            body {
                background: white;
                padding: 0;
            }
            .a4-page {
                box-shadow: none;
                width: 210mm;
                height: 297mm;
                padding: 5mm;
            }
            .print-btn {
                display: none;
            }
        }

        .print-btn {
            position: fixed;
            top: 15px;
            left: 15px;
            padding: 10px 22px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
            z-index: 1000;
        }
    </style>
</head>
<body>

    <button class="print-btn" onclick="window.print()">طباعة (A4)</button>

    <div class="a4-page">
        <!-- بط
